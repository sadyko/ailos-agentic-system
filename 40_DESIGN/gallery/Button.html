</head><body class="bg-neutral-50 text-neutral-900 p-8"><section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">primary / sm</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-8 px-3 text-sm bg-brand-600 text-neutral-50 hover:bg-brand-700 active:bg-brand-700 disabled:hover:bg-brand-600"><span>primary sm</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">primary / md</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-10 px-4 text-base bg-brand-600 text-neutral-50 hover:bg-brand-700 active:bg-brand-700 disabled:hover:bg-brand-600"><span>primary md</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">secondary / sm</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-8 px-3 text-sm bg-neutral-100 text-neutral-900 hover:bg-neutral-300 active:bg-neutral-300 disabled:hover:bg-neutral-100"><span>secondary sm</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">secondary / md</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-10 px-4 text-base bg-neutral-100 text-neutral-900 hover:bg-neutral-300 active:bg-neutral-300 disabled:hover:bg-neutral-100"><span>secondary md</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">ghost / sm</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-8 px-3 text-sm bg-transparent text-brand-700 hover:bg-brand-50 active:bg-brand-100 disabled:hover:bg-transparent"><span>ghost sm</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">ghost / md</h2><div class="flex flex-wrap items-center gap-4"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-10 px-4 text-base bg-transparent text-brand-700 hover:bg-brand-50 active:bg-brand-100 disabled:hover:bg-transparent"><span>ghost md</span></button></div></section>
<section class="mb-8"><h2 class="text-sm font-medium text-neutral-500 mb-3">disabled</h2><div class="flex flex-wrap items-center gap-4"><button type="button" disabled="" class="inline-flex items-center justify-center gap-2 rounded-md font-medium transition-colors duration-150 select-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-50 disabled:cursor-not-allowed disabled:opacity-60 h-10 px-4 text-base bg-brand-600 text-neutral-50 hover:bg-brand-700 active:bg-brand-700 disabled:hover:bg-brand-600"><span>Disabled</span></button></div></section>
